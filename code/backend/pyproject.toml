# Lint and format settings for the backend. Run `ruff check . && ruff format --check .` (CI does the same).
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, and docstrings on everything public
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D1"]
ignore = ["D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
