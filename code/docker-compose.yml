# Local run of the whole stack: http://localhost:5173 (app) and http://localhost:8000/mcp/ (agents).
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DUCKDB_PATH: /app/data/abh.duckdb
    ports:
      - "8000:8000"
    volumes:
      - hive-data:/app/data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  hive-data:
