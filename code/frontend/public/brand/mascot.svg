<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" role="img" aria-label="The B6 bee, the Adobee Hive mascot">
  <!-- Traced from the team's whiteboard bee: striped, hatched body, two loop wings, curly antenna. -->
  <style>
    .ink { fill: none; stroke: #5a2e1a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap 0.16s ease-in-out infinite alternate; }
    .wing.back { animation-delay: 0.08s; }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(0.45); } }
    @media (prefers-reduced-motion: reduce) { .wing { animation: none; } }
  </style>
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#5a2e1a" stroke-width="1.1"/>
    </pattern>
    <clipPath id="body"><path d="M18 56 C16 40 32 30 54 30 C76 30 90 38 90 55 C90 70 74 78 54 78 C34 78 19 71 18 56 Z"/></clipPath>
  </defs>
  <!-- wings -->
  <path class="wing back ink" d="M58 33 C50 14 60 6 66 14 C70 20 66 28 60 33" style="fill:#f6e7d3;fill-opacity:.8"/>
  <path class="wing ink" d="M64 33 C70 12 84 10 84 20 C84 27 74 31 66 33" style="fill:#f6e7d3;fill-opacity:.8"/>
  <!-- body with hatched stripes -->
  <path d="M18 56 C16 40 32 30 54 30 C76 30 90 38 90 55 C90 70 74 78 54 78 C34 78 19 71 18 56 Z" fill="#f2c14e"/>
  <g clip-path="url(#body)">
    <rect x="31" y="20" width="8" height="70" fill="url(#hatch)"/>
    <rect x="49" y="20" width="9" height="70" fill="url(#hatch)"/>
    <rect x="67" y="20" width="8" height="70" fill="url(#hatch)"/>
  </g>
  <g class="ink">
    <path d="M18 56 C16 40 32 30 54 30 C76 30 90 38 90 55 C90 70 74 78 54 78 C34 78 19 71 18 56 Z"/>
    <path d="M31 35 C29 50 30 64 32 75 M39 32 C37 50 38 64 40 77"/>
    <path d="M49 30 C47 48 48 64 50 78 M58 30 C56 48 57 64 59 78"/>
    <path d="M67 31 C65 48 66 64 68 77 M75 33 C73 50 74 64 76 75"/>
    <!-- stinger -->
    <path d="M18 58 L9 61 L18 63"/>
    <!-- head -->
    <path d="M89 54 C88 42 96 37 104 38 C113 39 118 46 117 54 C116 63 109 67 101 66 C93 65 89 61 89 54 Z" style="fill:#f2c14e"/>
    <!-- curly antenna -->
    <path d="M106 39 C108 30 112 24 118 21 C122 19 124 23 121 25"/>
  </g>
  <circle cx="102" cy="49" r="1.9" fill="#5a2e1a"/>
  <circle cx="109" cy="48" r="1.9" fill="#5a2e1a"/>
  <path d="M104 57 C106 58.5 108 58.5 109.5 57" class="ink" stroke-width="1.8"/>
</svg>
