<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d7a63"/></marker>
    <marker id="aTealStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#0d7a63"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563a8"/></marker>
  </defs>

  <rect width="1060" height="700" fill="#f7f6f3"/>

  <text x="44" y="52" font-size="26" font-weight="700" fill="#0f2230">Federation topology</text>
  <text x="44" y="78" font-size="14.5" fill="#5a7083">Hubs hold their own Cards and replicas of their peers'. No global registry, no central index — the index is everywhere.</text>

  <!-- seeking agent -->
  <g>
    <rect x="44" y="118" width="214" height="62" rx="10" fill="#e4eef8" stroke="#2563a8" stroke-width="1.5"/>
    <text x="60" y="142" font-size="13.5" font-weight="700" fill="#17436f">Traveller's agent</text>
    <text x="60" y="162" font-size="12" fill="#2563a8">"2 nights in Basel, quiet, &lt; CHF 250"</text>
    <path d="M151,180 L151,214" stroke="#2563a8" stroke-width="2" marker-end="url(#aBlue)"/>
    <text x="162" y="203" font-size="11.5" fill="#2563a8">asks its own hub only</text>
  </g>

  <!-- HUB BASEL -->
  <g>
    <rect x="44" y="222" width="286" height="196" rx="12" fill="#ffffff" stroke="#0d7a63" stroke-width="2"/>
    <rect x="44" y="222" width="286" height="34" rx="12" fill="#ddf0ea"/>
    <rect x="44" y="244" width="286" height="12" fill="#ddf0ea"/>
    <text x="62" y="245" font-size="14.5" font-weight="700" fill="#0a5949">Hub Basel</text>
    <text x="316" y="245" font-size="11" fill="#0d7a63" text-anchor="end">hotel association</text>
    <text x="62" y="278" font-size="11" fill="#5a7083">/.well-known/fedyworth</text>
    <text x="62" y="296" font-size="11.5" fill="#0f2230"><tspan font-weight="700">authoritative</tspan> · 34 Cards</text>
    <rect x="62" y="306" width="122" height="22" rx="5" fill="#f7f6f3" stroke="#c6d3dc"/>
    <text x="70" y="321" font-size="10.5" fill="#0f2230">Hotel Krafft</text>
    <rect x="190" y="306" width="128" height="22" rx="5" fill="#f7f6f3" stroke="#c6d3dc"/>
    <text x="198" y="321" font-size="10.5" fill="#0f2230">Café Rhein · +32</text>
    <text x="62" y="352" font-size="11.5" fill="#5a7083"><tspan font-weight="700" fill="#0f2230">replicas</tspan> · 918 Cards from 2 peers</text>
    <rect x="62" y="362" width="256" height="1" fill="#c6d3dc"/>
    <text x="62" y="382" font-size="10.5" fill="#5a7083">SQLite FTS5 + vector index</text>
    <text x="62" y="400" font-size="10.5" fill="#5a7083">declared ranking policy · no paid placement</text>
  </g>

  <!-- HUB ZURICH -->
  <g>
    <rect x="730" y="222" width="286" height="196" rx="12" fill="#ffffff" stroke="#0d7a63" stroke-width="2"/>
    <rect x="730" y="222" width="286" height="34" rx="12" fill="#ddf0ea"/>
    <rect x="730" y="244" width="286" height="12" fill="#ddf0ea"/>
    <text x="748" y="245" font-size="14.5" font-weight="700" fill="#0a5949">Hub Zürich</text>
    <text x="1002" y="245" font-size="11" fill="#0d7a63" text-anchor="end">freelancer co-op</text>
    <text x="748" y="278" font-size="11" fill="#5a7083">/.well-known/fedyworth</text>
    <text x="748" y="296" font-size="11.5" fill="#0f2230"><tspan font-weight="700">authoritative</tspan> · 806 Cards</text>
    <rect x="748" y="306" width="122" height="22" rx="5" fill="#f7f6f3" stroke="#c6d3dc"/>
    <text x="756" y="321" font-size="10.5" fill="#0f2230">Lena Hofmann</text>
    <rect x="876" y="306" width="128" height="22" rx="5" fill="#f7f6f3" stroke="#c6d3dc"/>
    <text x="884" y="321" font-size="10.5" fill="#0f2230">Grid Ops · +804</text>
    <text x="748" y="352" font-size="11.5" fill="#5a7083"><tspan font-weight="700" fill="#0f2230">replicas</tspan> · 146 Cards from 2 peers</text>
    <rect x="748" y="362" width="256" height="1" fill="#c6d3dc"/>
    <text x="748" y="382" font-size="10.5" fill="#5a7083">identity-verified members</text>
    <text x="748" y="400" font-size="10.5" fill="#5a7083">declared ranking policy · membership-funded</text>
  </g>

  <!-- HUB SELF-HOSTED -->
  <g>
    <rect x="387" y="508" width="286" height="150" rx="12" fill="#ffffff" stroke="#0d7a63" stroke-width="2"/>
    <rect x="387" y="508" width="286" height="34" rx="12" fill="#ddf0ea"/>
    <rect x="387" y="530" width="286" height="12" fill="#ddf0ea"/>
    <text x="405" y="531" font-size="14.5" font-weight="700" fill="#0a5949">hub.oleschmidt.ch</text>
    <text x="659" y="531" font-size="11" fill="#0d7a63" text-anchor="end">one person, one VPS</text>
    <text x="405" y="564" font-size="11.5" fill="#0f2230"><tspan font-weight="700">authoritative</tspan> · 1 Card</text>
    <text x="405" y="586" font-size="11.5" fill="#5a7083"><tspan font-weight="700" fill="#0f2230">replicas</tspan> · 952 Cards</text>
    <rect x="405" y="598" width="250" height="1" fill="#c6d3dc"/>
    <text x="405" y="620" font-size="10.5" fill="#5a7083">Same software, same protocol, same standing.</text>
    <text x="405" y="638" font-size="10.5" fill="#5a7083">Leaving a hub = re-publishing one file.</text>
  </g>

  <!-- peering: Basel <-> Zurich -->
  <path d="M330,300 L730,300" stroke="#0d7a63" stroke-width="2" marker-end="url(#aTeal)" marker-start="url(#aTealStart)"/>
  <rect x="404" y="266" width="252" height="26" rx="6" fill="#f7f6f3"/>
  <text x="530" y="284" font-size="11.5" fill="#0a5949" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /api/stream?cursor=8812</text>

  <!-- peering: Basel <-> self -->
  <path d="M250,418 L440,508" stroke="#0d7a63" stroke-width="2" marker-end="url(#aTeal)" marker-start="url(#aTealStart)"/>
  <!-- peering: Zurich <-> self -->
  <path d="M812,418 L622,508" stroke="#0d7a63" stroke-width="2" marker-end="url(#aTeal)" marker-start="url(#aTealStart)"/>

  <!-- center mechanism callout -->
  <g>
    <rect x="392" y="330" width="276" height="140" rx="10" fill="#ffffff" stroke="#c6d3dc" stroke-dasharray="4 3"/>
    <text x="408" y="354" font-size="12" font-weight="700" fill="#0f2230">Pull-based gossip</text>
    <text x="408" y="376" font-size="11" fill="#5a7083">Each hub tails its peers from a cursor.</text>
    <text x="408" y="394" font-size="11" fill="#5a7083">Offline hubs catch up by replaying.</text>
    <text x="408" y="418" font-size="12" font-weight="700" fill="#0f2230">Hubs cannot forge</text>
    <text x="408" y="440" font-size="11" fill="#5a7083">A replica carries the <tspan font-style="italic">subject's</tspan> signature.</text>
    <text x="408" y="458" font-size="11" fill="#5a7083">A hub can withhold — never fabricate.</text>
  </g>

  <!-- fan-out query annotation -->
  <g>
    <path d="M194,222 C150,180 120,170 96,196" fill="none" stroke="none"/>
    <rect x="44" y="436" width="286" height="76" rx="9" fill="#e4eef8" stroke="#2563a8" stroke-width="1.3"/>
    <text x="60" y="458" font-size="12" font-weight="700" fill="#17436f">Answer: local + replica, instantly</text>
    <text x="60" y="478" font-size="11" fill="#2563a8">Cold queries fan out to peers in parallel,</text>
    <text x="60" y="495" font-size="11" fill="#2563a8">with a token budget and a deadline.</text>
  </g>

  <!-- legend -->
  <g transform="translate(730,470)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#0f2230">Why federate at all</text>
    <text x="0" y="22" font-size="11" fill="#5a7083">An aggregator that owns the index owns</text>
    <text x="0" y="39" font-size="11" fill="#5a7083">the ranking, the margin and the customer.</text>
    <text x="0" y="56" font-size="11" fill="#5a7083">Here the index is replicated, so the</text>
    <text x="0" y="73" font-size="11" fill="#5a7083">operator is replaceable. That is the</text>
    <text x="0" y="90" font-size="11" fill="#5a7083">entire political content of the design.</text>
  </g>
</svg>
