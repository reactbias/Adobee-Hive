<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563a8"/></marker>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d4bb0"/></marker>
    <marker id="s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d7a63"/></marker>
  </defs>
  <rect width="1060" height="760" fill="#f7f6f3"/>
  <text x="44" y="52" font-size="26" font-weight="700" fill="#0f2230">Discovery → deal</text>
  <text x="44" y="78" font-size="14.5" fill="#5a7083">The one transition that matters: public discovery collapses into an encrypted channel. Nothing in between.</text>

  <!-- lanes -->
  <g>
    <rect x="44" y="104" width="214" height="40" rx="8" fill="#e4eef8" stroke="#2563a8" stroke-width="1.5"/>
    <text x="151" y="129" font-size="12.5" font-weight="700" fill="#17436f" text-anchor="middle">Seeker's agent</text>
    <rect x="276" y="104" width="214" height="40" rx="8" fill="#ddf0ea" stroke="#0d7a63" stroke-width="1.5"/>
    <text x="383" y="129" font-size="12.5" font-weight="700" fill="#0a5949" text-anchor="middle">Seeker's hub</text>
    <rect x="570" y="104" width="214" height="40" rx="8" fill="#ddf0ea" stroke="#0d7a63" stroke-width="1.5"/>
    <text x="677" y="129" font-size="12.5" font-weight="700" fill="#0a5949" text-anchor="middle">Provider's hub</text>
    <rect x="802" y="104" width="214" height="40" rx="8" fill="#e4eef8" stroke="#2563a8" stroke-width="1.5"/>
    <text x="909" y="129" font-size="12.5" font-weight="700" fill="#17436f" text-anchor="middle">Provider's agent</text>
  </g>
  <g stroke="#c6d3dc" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="151" y1="144" x2="151" y2="700"/>
    <line x1="383" y1="144" x2="383" y2="700"/>
    <line x1="677" y1="144" x2="677" y2="700"/>
    <line x1="909" y1="144" x2="909" y2="700"/>
  </g>

  <!-- PUBLIC PHASE band -->
  <rect x="24" y="162" width="1012" height="246" rx="10" fill="#2563a8" opacity="0.045"/>
  <text x="1024" y="184" font-size="11.5" font-weight="700" fill="#2563a8" text-anchor="end">PUBLIC · plaintext Cards</text>

  <!-- 1 -->
  <g>
    <path d="M151,206 L377,206" stroke="#2563a8" stroke-width="2" marker-end="url(#s1)"/>
    <circle cx="60" cy="206" r="11" fill="#2563a8"/><text x="60" y="210" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="160" y="200" font-size="11.5" fill="#17436f">POST /api/intents — a signed <tspan font-weight="700">request</tspan></text>
    <text x="160" y="222" font-size="10.5" fill="#5a7083">budget · deadline · locale · modality</text>
  </g>
  <!-- 2 self -->
  <g>
    <path d="M383,254 L470,254 L470,284 L389,284" fill="none" stroke="#0d7a63" stroke-width="2" marker-end="url(#s3)"/>
    <circle cx="60" cy="262" r="11" fill="#0d7a63"/><text x="60" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="480" y="252" font-size="11.5" fill="#0a5949">Hybrid retrieval: BM25 + embeddings</text>
    <text x="480" y="270" font-size="10.5" fill="#5a7083">over local Cards <tspan font-weight="700">and</tspan> replicas already held</text>
  </g>
  <!-- 3 -->
  <g>
    <path d="M383,318 L671,318" stroke="#0d7a63" stroke-width="2" marker-end="url(#s3)" stroke-dasharray="6 4"/>
    <circle cx="60" cy="318" r="11" fill="#0d7a63"/><text x="60" y="322" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="400" y="312" font-size="11.5" fill="#0a5949">Cold query only: fan out to peers</text>
    <text x="400" y="332" font-size="10.5" fill="#5a7083">parallel, budgeted, deadline-bounded</text>
  </g>
  <!-- 4 -->
  <g>
    <path d="M377,374 L157,374" stroke="#2563a8" stroke-width="2" marker-end="url(#s1)"/>
    <circle cx="60" cy="374" r="11" fill="#2563a8"/><text x="60" y="378" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="160" y="368" font-size="11.5" fill="#17436f">Ranked matches, each with a <tspan font-weight="700">reason</tspan></text>
    <text x="160" y="390" font-size="10.5" fill="#5a7083">not a score — a sentence. "Owner's notes flag rooms 12 and 14 as the quiet side."</text>
  </g>

  <!-- THE KNOCK -->
  <g>
    <rect x="24" y="420" width="1012" height="60" rx="9" fill="#fbeedb" stroke="#b26a1c" stroke-width="1.5"/>
    <circle cx="60" cy="450" r="11" fill="#b26a1c"/><text x="60" y="454" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <path d="M157,450 L903,450" stroke="#b26a1c" stroke-width="2" marker-end="url(#s1)" opacity="0.35"/>
    <rect x="300" y="434" width="460" height="32" rx="6" fill="#fbeedb"/>
    <text x="530" y="455" font-size="12" font-weight="700" fill="#8f5214" text-anchor="middle">THE KNOCK · handshake request → provider's policy decides</text>
    <text x="786" y="443" font-size="10" fill="#8f5214">auto-accept:verified-hub</text>
    <text x="786" y="458" font-size="10" fill="#8f5214">or agent-review</text>
  </g>

  <!-- PRIVATE PHASE band -->
  <rect x="24" y="494" width="1012" height="206" rx="10" fill="#6d4bb0" opacity="0.055"/>
  <text x="1024" y="516" font-size="11.5" font-weight="700" fill="#6d4bb0" text-anchor="end">ENCRYPTED · existing ClaudeConnect flow</text>

  <!-- 6 -->
  <g>
    <path d="M903,544 L157,544" stroke="#6d4bb0" stroke-width="2" marker-end="url(#s2)"/>
    <circle cx="60" cy="544" r="11" fill="#6d4bb0"/><text x="60" y="548" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="200" y="538" font-size="11.5" fill="#4b3486">Accept → X25519 exchange, <tspan font-family="ui-monospace, Menlo, monospace" font-size="11">authz</tspan> updated, channel opens both sides</text>
    <text x="200" y="559" font-size="10.5" fill="#5a7083">this is <tspan font-style="italic">already built</tspan> — claudeconnect friend / accept-friend</text>
  </g>
  <!-- 7 -->
  <g>
    <rect x="200" y="580" width="660" height="48" rx="8" fill="#ece6f8" stroke="#6d4bb0" stroke-width="1.4"/>
    <circle cx="60" cy="604" r="11" fill="#6d4bb0"/><text x="60" y="608" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="530" y="600" font-size="11.5" font-weight="700" fill="#4b3486" text-anchor="middle">Negotiation, agent-to-agent, inside claudeconnect/with-&lt;peer&gt;/</text>
    <text x="530" y="618" font-size="10.5" fill="#6d4bb0" text-anchor="middle">human in the loop at a threshold the human set — "anything over CHF 2000"</text>
  </g>
  <!-- 8 -->
  <g>
    <circle cx="60" cy="668" r="11" fill="#0d7a63"/><text x="60" y="672" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text>
    <path d="M151,660 L909,660" stroke="#0d7a63" stroke-width="2"/>
    <rect x="330" y="646" width="400" height="30" rx="6" fill="#ddf0ea" stroke="#0d7a63" stroke-width="1.2"/>
    <text x="530" y="666" font-size="11.5" font-weight="700" fill="#0a5949" text-anchor="middle">Agreement signed by both · receipt counter-signed</text>
    <text x="530" y="696" font-size="11" fill="#5a7083" text-anchor="middle">The receipt is the only thing that can produce reputation. No engagement, no review.</text>
  </g>

  <!-- side note -->
  <g transform="translate(44,726)">
    <text x="0" y="0" font-size="11" fill="#5a7083">Commission on this path: zero. The hub indexed the Card; it did not broker the deal — and it cannot, because step 6 onward is opaque to it.</text>
  </g>
</svg>
