<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9bab"/></marker>
  </defs>
  <rect width="1060" height="700" fill="#f7f6f3"/>
  <text x="44" y="52" font-size="26" font-weight="700" fill="#0f2230">Anatomy of a Card</text>
  <text x="44" y="78" font-size="14.5" fill="#5a7083">Generated from the vault, signed by its subject, served by any hub that has it.</text>

  <!-- the document -->
  <rect x="44" y="108" width="520" height="560" rx="10" fill="#ffffff" stroke="#0f2230" stroke-width="1.8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <text x="64" y="134" fill="#8b9bab">{</text>
    <text x="64" y="154" fill="#0f2230">  "id": <tspan fill="#2563a8">"fedy:hub.basel.swiss/krafft@…"</tspan>,</text>
    <text x="64" y="172" fill="#0f2230">  "seq": <tspan fill="#b26a1c">47</tspan>, "updated": <tspan fill="#2563a8">"2026-10-31T09:12Z"</tspan>,</text>
    <text x="64" y="190" fill="#0f2230">  "kind": <tspan fill="#2563a8">"business"</tspan>,</text>

    <text x="64" y="216" fill="#0f2230">  "identity": { name, tagline, place, locales },</text>

    <text x="64" y="242" fill="#0f2230">  "keys": {</text>
    <text x="64" y="260" fill="#0f2230">    "sig": <tspan fill="#2563a8">"ed25519:b3f1…"</tspan>,</text>
    <text x="64" y="278" fill="#0f2230">    "kex": <tspan fill="#2563a8">"x25519:a1b2…"</tspan> },</text>

    <text x="64" y="304" fill="#0f2230">  "links": [</text>
    <text x="64" y="322" fill="#0f2230">    { website,  proof: <tspan fill="#0d7a63">"dns-txt"</tspan> },</text>
    <text x="64" y="340" fill="#0f2230">    { instagram, proof: <tspan fill="#0d7a63">"rel-me"</tspan> },</text>
    <text x="64" y="358" fill="#0f2230">    { maps,      proof: <tspan fill="#a83232">"none"</tspan> } ],</text>

    <text x="64" y="384" fill="#0f2230">  "skills": [ hospitality.lodging, events… ],</text>

    <text x="64" y="410" fill="#0f2230">  "offers": [ room-booking, terrace-event ],</text>
    <text x="64" y="428" fill="#0f2230">  "needs":  [ frontdesk-spring ],</text>

    <text x="64" y="454" fill="#0f2230">  "structure": [</text>
    <text x="64" y="472" fill="#0f2230">    { "rooms/", 26, <tspan fill="#2563a8">public-summary</tspan>, sha256 },</text>
    <text x="64" y="490" fill="#0f2230">    { "house/",  5, <tspan fill="#2563a8">public</tspan>,         sha256 },</text>
    <text x="64" y="508" fill="#0f2230">    { "guests/",211, <tspan fill="#a83232">private</tspan>,        null },</text>
    <text x="64" y="526" fill="#0f2230">    { "finance/",0, <tspan fill="#a83232">hidden</tspan>,         null } ],</text>

    <text x="64" y="552" fill="#0f2230">  "endpoints": { mcp, handshake, contact },</text>
    <text x="64" y="570" fill="#0f2230">  "policy": { handshake, human_in_loop, rate },</text>
    <text x="64" y="588" fill="#0f2230">  "attestations": [ … countersigned … ],</text>
    <text x="64" y="606" fill="#0f2230">  "provenance": { generator, vault_digest },</text>
    <text x="64" y="632" fill="#0f2230">  "sig": <tspan fill="#6d4bb0">"ed25519:f10a9c3b…"</tspan></text>
    <text x="64" y="652" fill="#8b9bab">}</text>
  </g>

  <!-- callouts -->
  <g font-size="12">
    <path d="M564,250 L612,250" stroke="#8b9bab" stroke-width="1.3" marker-end="url(#cl)"/>
    <rect x="618" y="222" width="398" height="60" rx="8" fill="#ece6f8" stroke="#6d4bb0" stroke-width="1.3"/>
    <text x="634" y="243" font-weight="700" fill="#4b3486" font-size="12">Two keys, two jobs</text>
    <text x="634" y="262" fill="#4b3486" font-size="11.3">X25519 does ECDH, not signatures. Cards need an Ed25519</text>
    <text x="634" y="276" fill="#4b3486" font-size="11.3">signing key alongside it — conflating them is a real error.</text>

    <path d="M564,330 L612,330" stroke="#8b9bab" stroke-width="1.3" marker-end="url(#cl)"/>
    <rect x="618" y="298" width="398" height="60" rx="8" fill="#ddf0ea" stroke="#0d7a63" stroke-width="1.3"/>
    <text x="634" y="319" font-weight="700" fill="#0a5949" font-size="12">A link only counts if it links back</text>
    <text x="634" y="338" fill="#0a5949" font-size="11.3">Bidirectional proof, Mastodon rel=me style. Cheap, strong,</text>
    <text x="634" y="352" fill="#0a5949" font-size="11.3">no KYC. Unproven links are carried but marked.</text>

    <path d="M564,420 L612,420" stroke="#8b9bab" stroke-width="1.3" marker-end="url(#cl)"/>
    <rect x="618" y="374" width="398" height="78" rx="8" fill="#fbeedb" stroke="#b26a1c" stroke-width="1.3"/>
    <text x="634" y="395" font-weight="700" fill="#8f5214" font-size="12">One primitive, both sides of the market</text>
    <text x="634" y="414" fill="#8f5214" font-size="11.3">The hotel's <tspan font-weight="700">offers</tspan> make it bookable. Its <tspan font-weight="700">needs</tspan> make it an</text>
    <text x="634" y="428" fill="#8f5214" font-size="11.3">employer. Same file, same query path — which is why this is</text>
    <text x="634" y="442" fill="#8f5214" font-size="11.3">Upwork <tspan font-style="italic">and</tspan> Booking.com rather than either one.</text>

    <path d="M564,490 L612,490" stroke="#8b9bab" stroke-width="1.3" marker-end="url(#cl)"/>
    <rect x="618" y="468" width="398" height="78" rx="8" fill="#e4eef8" stroke="#2563a8" stroke-width="1.3"/>
    <text x="634" y="489" font-weight="700" fill="#17436f" font-size="12">Structure without contents</text>
    <text x="634" y="508" fill="#17436f" font-size="11.3">An agent learns that 26 rooms are documented and can</text>
    <text x="634" y="522" fill="#17436f" font-size="11.3">detect change from the digest — without reading a line.</text>
    <text x="634" y="536" fill="#17436f" font-size="11.3">Enough to decide whether it is worth knocking.</text>

    <path d="M564,628 L612,628" stroke="#8b9bab" stroke-width="1.3" marker-end="url(#cl)"/>
    <rect x="618" y="562" width="398" height="106" rx="8" fill="#ffffff" stroke="#c6d3dc" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="634" y="583" font-weight="700" fill="#0f2230" font-size="12">The signature is what makes it federable</text>
    <text x="634" y="602" fill="#5a7083" font-size="11.3">Because the subject signs, a replica is verifiable against</text>
    <text x="634" y="616" fill="#5a7083" font-size="11.3">the subject's key rather than the hub's. Any hub may carry</text>
    <text x="634" y="630" fill="#5a7083" font-size="11.3">your Card; none may rewrite it to favour a paying rival.</text>
    <text x="634" y="651" fill="#0f2230" font-size="11.3" font-style="italic">It proves authorship — not accuracy. See attestations.</text>
  </g>
</svg>
