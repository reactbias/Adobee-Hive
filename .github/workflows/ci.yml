name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # A throwaway Postgres so the snapshot round trip runs against the real thing (test_persist.py)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, no password to leak
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # Does the suite actually notice when the code is wrong? Breaks federation, reputation,
  # calibration, connections and sharing on purpose and fails if a break goes unnoticed.
  # Separate from `backend` so a surviving mutant reads as "the tests have a hole", not
  # "the build is broken", and so it can be read at a glance in the checks list.
  mutation:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The curated mutants are deterministic and must all die.
      - run: python tools/mutate.py
      # Plus a seeded random pass, so a different corner is probed on each run without
      # making the result irreproducible: the seed is printed and in the log.
      - name: Random mutants (seeded by run number)
        run: python tools/mutate.py --random 8 --seed ${{ github.run_number }}
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The repo is public: every push is scanned for keys, tokens and credentials across the whole history.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan them
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
