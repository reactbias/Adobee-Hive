# Builds the backend image and pushes it to ECR. App Runner is created with auto-deploy on,
# so a new :latest image rolls out by itself. Needs repo secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY (an IAM user allowed to push to the ECR repo).
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["code/backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: adobee-hive-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Until scripts/aws/bootstrap.sh has run and the secrets exist, skip instead of failing main.
      AWS_READY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: AWS not set up yet
        if: env.AWS_READY != 'true'
        run: echo "::notice::Skipping deploy; add AWS secrets after running code/scripts/aws/bootstrap.sh."

      - uses: actions/checkout@v4
        if: env.AWS_READY == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_READY == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: env.AWS_READY == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        if: env.AWS_READY == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" code/backend
          docker push --all-tags "$IMAGE"
