# Render Blueprint for the backend: free web service built from code/backend/Dockerfile,
# redeployed on every push to main. Render asks for OPENAI_API_KEY when the Blueprint is created.
# A free Render Postgres keeps the data across redeploys (DATABASE_URL, internal network only).
databases:
  - name: adobee-hive-db
    plan: free
    region: frankfurt
    ipAllowList: [] # no access from the internet; only the web service reaches it
services:
  - type: web
    name: adobee-hive
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: code/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: OWNER_EDIT_TOKEN
        generateValue: true
      - key: DEMO_RESET_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adobee-hive-db
          property: connectionString
